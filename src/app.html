<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Applied before first paint so a saved theme choice never flashes the wrong mode.
			try {
				var saved = localStorage.getItem('fieldline-theme');
				if (saved === 'light' || saved === 'dark') {
					document.documentElement.setAttribute('data-theme', saved);
				}
				// The position-palette picker was removed; drop any choice it saved.
				localStorage.removeItem('fieldline-position-palette');
			} catch (e) {}
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
